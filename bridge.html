<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息展示中心 - 海高论坛</title>
    <link rel="icon" type="image/png" href="./image.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f4f6f8; --text-color: #2d3748; 
            --border-color: rgba(226, 232, 240, 0.6); 
            --primary-color: #3182ce; --meta-color: #718096;
        }
        [data-theme="dark"] {
            --bg-color: #1a202c; --text-color: #f7fafc; 
            --border-color: rgba(74, 85, 104, 0.6); 
            --primary-color: #63b3ed; --meta-color: #a0aec0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: url('beijing.png');
            background-size: cover; background-position: center;
            background-repeat: no-repeat; background-attachment: fixed;
            color: var(--text-color); margin: 0; padding: 15px; box-sizing: border-box;
            min-height: 100vh;
        }
        .container { max-width: 680px; margin: 0 auto; }
        
        /* 移除卡片边框与厚重阴影，改为轻量扁平化无框设计 */
        .section-block {
            margin-bottom: 20px; padding: 5px 0;
        }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        
        /* 去除输入框外框，只保留底部微线或纯文本态 */
        .info-value {
            flex-grow: 1; padding: 6px 10px; margin-bottom: 0;
            background: transparent; color: var(--text-color);
            border: none; border-bottom: 1px dashed var(--border-color);
            font-size: 14px; line-height: 1.5; text-align: right;
        }
        button {
            background-color: var(--primary-color); color: white; border: none;
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;
        }
        button:hover { opacity: 0.9; }
        .profile-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 4px 0; }
        .profile-row label { font-size: 13px; color: var(--meta-color); flex-shrink: 0; }
        
        .avatar-container { text-align: center; margin-bottom: 15px; }
        .avatar-img {
            width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--primary-color); box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        .level-badge {
            display: inline-block; background: #3182ce; color: white;
            font-size: 12px; padding: 2px 10px; border-radius: 10px; font-weight: bold; margin-bottom: 10px;
        }
        .privacy-tag {
            font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #e2e8f0; color: #4a5568; margin-left: 8px; flex-shrink: 0;
        }
        [data-theme="dark"] .privacy-tag { background: #4a5568; color: #cbd5e0; }
        h3 { font-size: 14px; color: var(--meta-color); border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-top: 20px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 顶部导航栏（无框精简） -->
    <div class="flex section-block" style="padding-bottom: 10px; border-bottom: 1px solid var(--border-color);">
        <h2 style="margin:0; font-size: 18px;">个人信息展示</h2>
        <button onclick="window.location.href='index.html'" style="background:#718096;">返回论坛</button>
    </div>

    <!-- 用户核心态 -->
    <div class="section-block avatar-container">
        <img id="user-avatar" src="icon.png" alt="用户头像" class="avatar-img">
        <div id="user-nickname-title" style="font-weight: bold; font-size: 16px; margin-top: 6px;">加载中...</div>
        <div id="user-level-tag" class="level-badge" style="margin-top: 6px;">Lv.1 (经验: 0)</div>
    </div>

    <!-- 账号基本资料 -->
    <div class="section-block">
        <h3>账号与基本资料</h3>
        <div class="profile-row">
            <label>绑定邮箱</label>
            <div id="p-email" class="info-value">-</div>
        </div>
        <div class="profile-row">
            <label>当前身份</label>
            <div id="p-role" class="info-value">-</div>
        </div>
        <div class="profile-row">
            <label>年级</label>
            <div id="p-grade" class="info-value">-</div>
        </div>
    </div>

    <!-- 详细个人档案与公开状态 -->
    <div class="section-block">
        <h3>详细档案与公开状态</h3>
        <div class="profile-row">
            <label>真实姓名</label>
            <div style="display: flex; align-items: center; width: 70%;">
                <div id="p-real-name" class="info-value" style="text-align: right;">-</div>
                <span id="tag-real-name" class="privacy-tag">状态</span>
            </div>
        </div>
        <div class="profile-row">
            <label>手机号</label>
            <div style="display: flex; align-items: center; width: 70%;">
                <div id="p-phone" class="info-value" style="text-align: right;">-</div>
                <span id="tag-phone" class="privacy-tag">状态</span>
            </div>
        </div>
        <div class="profile-row">
            <label>性别</label>
            <div style="display: flex; align-items: center; width: 70%;">
                <div id="p-gender" class="info-value" style="text-align: right;">-</div>
                <span id="tag-gender" class="privacy-tag">状态</span>
            </div>
        </div>
        <div class="profile-row">
            <label>年龄</label>
            <div style="display: flex; align-items: center; width: 70%;">
                <div id="p-age" class="info-value" style="text-align: right;">-</div>
                <span id="tag-age" class="privacy-tag">状态</span>
            </div>
        </div>
        <div class="profile-row">
            <label>生日</label>
            <div style="display: flex; align-items: center; width: 70%;">
                <div id="p-birthday" class="info-value" style="text-align: right;">-</div>
                <span id="tag-birthday" class="privacy-tag">状态</span>
            </div>
        </div>
        <div class="profile-row">
            <label>星座</label>
            <div style="display: flex; align-items: center; width: 70%;">
                <div id="p-constellation" class="info-value" style="text-align: right;">-</div>
                <span id="tag-constellation" class="privacy-tag">状态</span>
            </div>
        </div>
        <div class="profile-row">
            <label>故乡</label>
            <div style="display: flex; align-items: center; width: 70%;">
                <div id="p-hometown" class="info-value" style="text-align: right;">-</div>
                <span id="tag-hometown" class="privacy-tag">状态</span>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. 初始化主题与背景跟随逻辑
    function initThemeAndBg() {
        const savedTheme = localStorage.getItem('forum_theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else if (savedTheme === 'light') {
            document.documentElement.removeAttribute('data-theme');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        const customBg = localStorage.getItem('forum_custom_bg') || localStorage.getItem('custom_bg') || localStorage.getItem('customBg') || localStorage.getItem('bg_image');
        if (customBg) {
            document.body.style.backgroundImage = `url("${customBg}")`;
        } else {
            document.body.style.backgroundImage = "url('beijing.png')";
        }
    }
    initThemeAndBg();

    window.addEventListener('storage', (event) => {
        if (event.key === 'forum_theme') {
            if (event.newValue === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        } else if (['forum_custom_bg', 'custom_bg', 'customBg', 'bg_image'].includes(event.key)) {
            if (event.newValue) {
                document.body.style.backgroundImage = `url("${event.newValue}")`;
            } else {
                document.body.style.backgroundImage = "url('beijing.png')";
            }
        }
    });

    // 2. 初始化 Supabase 并加载用户个人信息进行纯展示渲染
    const db = window.sbApp || window.supabase.createClient('https://snlikjcmuwkyibogfupy.supabase.co', 'sb_publishable_8stbmdXfZMtBGjwaq16ajw_KBDzE9ZW');

    async function initBridgePage() {
        const { data: { session } } = await db.auth.getSession();
        if (!session) {
            alert('请先登录论坛！');
            window.location.href = 'index.html';
            return;
        }
        const currentUser = session.user;
        loadUserProfileData(currentUser);
    }

    async function loadUserProfileData(user) {
        const { data, error } = await db.from('profiles').select('*').eq('id', user.id).single();
        if (error || !data) {
            console.error('获取个人信息失败', error);
            return;
        }

        document.getElementById('p-email').innerText = user.email || '未绑定';
        document.getElementById('p-role').innerText = data.is_admin ? '管理员' : '普通成员';
        document.getElementById('p-grade').innerText = data.grade || '未设置';
        
        const nickname = data.nickname || '无昵称';
        document.getElementById('user-nickname-title').innerText = nickname;

        const exp = data.exp || 0;
        const level = data.level || 1;
        document.getElementById('user-level-tag').innerText = `Lv.${level} (当前经验: ${exp})`;

        document.getElementById('user-avatar').src = data.avatar_url || 'icon.png';

        const fields = ['real_name', 'phone', 'gender', 'age', 'birthday', 'constellation', 'hometown'];
        fields.forEach(field => {
            const val = data[field];
            const isPublic = data[`pub_${field}`] !== false;
            
            const valEl = document.getElementById(`p-${field.replace('_', '-')}`);
            const tagEl = document.getElementById(`tag-${field.replace('_', '-')}`);

            if (valEl) {
                valEl.innerText = (val !== null && val !== undefined && val !== '') ? val : '未填写';
            }
            if (tagEl) {
                tagEl.innerText = isPublic ? '公开' : '私密';
                tagEl.style.background = isPublic ? '#c6f6d5' : '#fed7d7';
                tagEl.style.color = isPublic ? '#22543d' : '#742a2a';
            }
        });
    }

    initBridgePage();
</script>

</body>
</html>
