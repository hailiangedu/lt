<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息展示中心 - 海高论坛</title>
    <link rel="icon" type="image/png" href="./image.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --text-color: #2d3748;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(226, 232, 240, 0.6);
            --primary-color: #3182ce;
            --meta-color: #718096;
            --hover-bg: #ebf8ff;
        }
        [data-theme="dark"] {
            --bg-color: #1a202c;
            --text-color: #f7fafc;
            --card-bg: rgba(45, 55, 72, 0.85);
            --border-color: rgba(74, 85, 104, 0.6);
            --primary-color: #63b3ed;
            --meta-color: #a0aec0;
            --hover-bg: #2c5282;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: url('beijing.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }
        .container {
            max-width: 1050px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        .flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-value {
            color: var(--text-color);
            font-size: 14px;
            line-height: 1.5;
            flex-grow: 1;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            opacity: 0.9;
        }
        .profile-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }
        .profile-row label {
            width: 75px;
            font-size: 13px;
            color: var(--meta-color);
            flex-shrink: 0;
        }
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px 20px;
        }
        @media (max-width: 900px) {
            .profile-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
        /* 功能集成区网格按钮 */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        .feature-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            text-decoration: none;
        }
        .feature-btn:hover {
            background-color: var(--hover-bg);
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }
        .avatar-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        .level-badge {
            display: inline-block;
            background: #3182ce;
            color: white;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .privacy-tag {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #e2e8f0;
            color: #4a5568;
            flex-shrink: 0;
        }
        [data-theme="dark"] .privacy-tag {
            background: #4a5568;
            color: #cbd5e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card flex" style="padding: 15px 25px;">
            <h2 style="margin:0;">个人信息展示中心</h2>
            <button onclick="window.location.href='index.html'" style="background:#718096;">返回论坛</button>
        </div>

        <div class="card">
            <div class="avatar-container">
                <img id="user-avatar" src="icon.png" alt="用户头像" class="avatar-img">
                <div id="user-nickname-title" style="font-weight: bold; font-size: 18px; margin-top: 10px;">加载中...</div>
            </div>
            
            <div style="text-align: center; margin-bottom: 15px;">
                <div id="user-level-tag" class="level-badge">Lv.1 (经验: 0)</div>
            </div>

            <h3>账号与基本资料</h3>
            <div class="profile-grid" style="margin-bottom: 15px;">
                <div class="profile-row">
                    <label>绑定邮箱：</label>
                    <div id="p-email" class="info-value">-</div>
                </div>
                <div class="profile-row">
                    <label>当前身份：</label>
                    <div id="p-role" class="info-value">-</div>
                </div>
                <div class="profile-row">
                    <label>年级：</label>
                    <div id="p-grade" class="info-value">-</div>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">

            <h3>详细个人档案与公开状态</h3>
            <div class="profile-grid">
                <div class="profile-row">
                    <label>真实姓名：</label>
                    <div id="p-real-name" class="info-value">-</div>
                    <span id="tag-real-name" class="privacy-tag">状态</span>
                </div>
                <div class="profile-row">
                    <label>手机号：</label>
                    <div id="p-phone" class="info-value">-</div>
                    <span id="tag-phone" class="privacy-tag">状态</span>
                </div>
                <div class="profile-row">
                    <label>性别：</label>
                    <div id="p-gender" class="info-value">-</div>
                    <span id="tag-gender" class="privacy-tag">状态</span>
                </div>
                <div class="profile-row">
                    <label>年龄：</label>
                    <div id="p-age" class="info-value">-</div>
                    <span id="tag-age" class="privacy-tag">状态</span>
                </div>
                <div class="profile-row">
                    <label>生日：</label>
                    <div id="p-birthday" class="info-value">-</div>
                    <span id="tag-birthday" class="privacy-tag">状态</span>
                </div>
                <div class="profile-row">
                    <label>星座：</label>
                    <div id="p-constellation" class="info-value">-</div>
                    <span id="tag-constellation" class="privacy-tag">状态</span>
                </div>
                <div class="profile-row">
                    <label>故乡：</label>
                    <div id="p-hometown" class="info-value">-</div>
                    <span id="tag-hometown" class="privacy-tag">状态</span>
                </div>
            </div>
        </div>

        <!-- 新增功能集成区 -->
        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 10px;">功能集成区</h3>
            <div class="feature-grid">
                <a href="space.html" class="feature-btn">
                    <span>成员列表</span>
                    <span>→</span>
                </a>
                <!--<a href="feedback.html" class="feature-btn">
                    <span>意见反馈</span>
                    <span>→</span>
                </a>
                <a href="confirm.html" class="feature-btn">
                    <span>认证中心</span>
                    <span>→</span>
                </a>
                <a href="index.html" class="feature-btn">
                    <span>返回论坛首页</span>
                    <span>→</span>
                </a>-->
            </div>
        </div>
    </div>

    <script>
        function initThemeAndBg() {
            const savedTheme = localStorage.getItem('forum_theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (savedTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }

            const customBg = localStorage.getItem('forum_custom_bg') || localStorage.getItem('custom_bg') || localStorage.getItem('customBg') || localStorage.getItem('bg_image');
            if (customBg) {
                document.body.style.backgroundImage = `url("${customBg}")`;
            } else {
                document.body.style.backgroundImage = "url('beijing.png')";
            }
        }
        initThemeAndBg();

        window.addEventListener('storage', (event) => {
            if (event.key === 'forum_theme') {
                if (event.newValue === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
            } else if (['forum_custom_bg', 'custom_bg', 'customBg', 'bg_image'].includes(event.key)) {
                if (event.newValue) {
                    document.body.style.backgroundImage = `url("${event.newValue}")`;
                } else {
                    document.body.style.backgroundImage = "url('beijing.png')";
                }
            }
        });

        const db = window.sbApp || window.supabase.createClient('https://snlikjcmuwkyibogfupy.supabase.co', 'sb_publishable_8stbmdXfZMtBGjwaq16ajw_KBDzE9ZW');

        async function initBridgePage() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) {
                alert('请先登录论坛！');
                window.location.href = 'index.html';
                return;
            }
            const currentUser = session.user;
            loadUserProfileData(currentUser);
        }

        async function loadUserProfileData(user) {
            const { data, error } = await db.from('profiles').select('*').eq('id', user.id).single();
            if (error || !data) {
                console.error('获取个人信息失败', error);
                return;
            }

            document.getElementById('p-email').innerText = user.email || '未绑定';
            document.getElementById('p-role').innerText = data.is_admin ? '管理员' : '普通成员';
            document.getElementById('p-grade').innerText = data.grade || '未设置';
            
            const nickname = data.nickname || '无昵称';
            document.getElementById('user-nickname-title').innerText = nickname;

            const exp = data.exp || 0;
            const level = data.level || 1;
            document.getElementById('user-level-tag').innerText = `Lv.${level} (当前经验: ${exp})`;

            document.getElementById('user-avatar').src = data.avatar_url || 'icon.png';

            const fields = ['real_name', 'phone', 'gender', 'age', 'birthday', 'constellation', 'hometown'];
            fields.forEach(field => {
                const val = data[field];
                const isPublic = data[`pub_${field}`] !== false; 
                const valEl = document.getElementById(`p-${field.replace('_', '-')}`);
                const tagEl = document.getElementById(`tag-${field.replace('_', '-')}`);

                if (valEl) {
                    valEl.innerText = (val !== null && val !== undefined && val !== '') ? val : '未填写';
                }
                if (tagEl) {
                    tagEl.innerText = isPublic ? '公开' : '私密';
                    tagEl.style.background = isPublic ? '#c6f6d5' : '#fed7d7';
                    tagEl.style.color = isPublic ? '#22543d' : '#742a2a';
                }
            });
        }

        initBridgePage();
    </script>
</body>
</html>
