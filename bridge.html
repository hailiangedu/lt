<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息桥接与资料中心 - 海高论坛</title>
    <link rel="icon" type="image/png" href="./image.png">
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f4f6f8; --text-color: #2d3748; --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: #e2e8f0; --primary-color: #66ccff; --meta-color: #718096; --hover-bg: #ebf8ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 20px; box-sizing: border-box;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 25px; margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        input, select {
            width: 100%; padding: 10px; margin-bottom: 10px;
            background: var(--card-bg); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box;
        }
        button {
            background-color: var(--primary-color); color: white; border: none;
            padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        button:hover { opacity: 0.9; }
        .profile-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
        .profile-row label { width: 90px; font-size: 13px; color: var(--meta-color); flex-shrink: 0; }
        
        /* 头像样式 */
        .avatar-container {
            text-align: center; margin-bottom: 20px; position: relative;
        }
        .avatar-img {
            width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--primary-color); box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        .avatar-upload-label {
            display: inline-block; margin-top: 8px; font-size: 12px;
            background: #4a5568; color: white; padding: 5px 12px; border-radius: 4px; cursor: pointer;
        }
        .level-badge {
            display: inline-block; background: #3182ce; color: white;
            font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: bold; margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card flex" style="padding: 15px 25px;">
        <h2 style="margin:0;">个人信息桥接中心</h2>
        <button onclick="window.location.href='index.html'" style="background:#718096;">返回论坛</button>
    </div>

    <div class="card">
        <!-- 头像显示与上传区域 -->
        <div class="avatar-container">
            <img id="user-avatar" src="icon.png" alt="用户头像" class="avatar-img">
            <div>
                <label class="avatar-upload-label">
                    更换头像
                    <input type="file" id="avatar-file-input" accept="image/*" style="display: none;" onchange="handleAvatarUpload(this)">
                </label>
            </div>
            <div id="avatar-msg" style="font-size: 11px; color: var(--meta-color); margin-top: 5px;"></div>
        </div>

        <div style="text-align: center; margin-bottom: 15px;">
            <div id="user-level-tag" class="level-badge">Lv.1 (经验: 0)</div>
        </div>

        <h3>账号与基本资料</h3>
        
        <div class="profile-row">
            <label>绑定邮箱：</label>
            <input type="text" id="p-email" disabled style="background: var(--bg-color); margin-bottom:0;">
        </div>
        <div class="profile-row">
            <label>当前身份：</label>
            <input type="text" id="p-role" disabled style="background: var(--bg-color); margin-bottom:0;">
        </div>
        <div class="profile-row">
            <label><span style="color:red;">*</span> 年级：</label>
            <select id="p-grade" style="margin-bottom:0;">
                <option value="毕业">毕业</option>
                <option value="高三">高三</option>
                <option value="高二">高二</option>
                <option value="高一">高一</option>
                <option value="英才">英才</option>
            </select>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">

        <h3>详细个人档案 (及公开状态)</h3>
        
        <div class="profile-row">
            <label>昵称：</label>
            <input type="text" id="p-nickname" style="margin-bottom:0;">
        </div>
        <div class="profile-row">
            <label>真实姓名：</label>
            <input type="text" id="p-real-name" style="margin-bottom:0;">
            <label style="width:auto; font-size:11px;"><input type="checkbox" id="pub-real-name"> 公开</label>
        </div>
        <div class="profile-row">
            <label>手机号：</label>
            <input type="text" id="p-phone" style="margin-bottom:0;">
            <label style="width:auto; font-size:11px;"><input type="checkbox" id="pub-phone"> 公开</label>
        </div>
        <div class="profile-row">
            <label>性别：</label>
            <input type="text" id="p-gender" placeholder="如: 男/女" style="margin-bottom:0;">
            <label style="width:auto; font-size:11px;"><input type="checkbox" id="pub-gender" checked> 公开</label>
        </div>
        <div class="profile-row">
            <label>年龄：</label>
            <input type="number" id="p-age" style="margin-bottom:0;">
            <label style="width:auto; font-size:11px;"><input type="checkbox" id="pub-age" checked> 公开</label>
        </div>
        <div class="profile-row">
            <label>生日：</label>
            <input type="text" id="p-birthday" placeholder="如: 05-20" style="margin-bottom:0;">
            <label style="width:auto; font-size:11px;"><input type="checkbox" id="pub-birthday" checked> 公开</label>
        </div>
        <div class="profile-row">
            <label>星座：</label>
            <input type="text" id="p-constellation" placeholder="如: 金牛座" style="margin-bottom:0;">
            <label style="width:auto; font-size:11px;"><input type="checkbox" id="pub-constellation" checked> 公开</label>
        </div>
        <div class="profile-row">
            <label>故乡：</label>
            <input type="text" id="p-hometown" placeholder="如: 北京" style="margin-bottom:0;">
            <label style="width:auto; font-size:11px;"><input type="checkbox" id="pub-hometown" checked> 公开</label>
        </div>

        <button onclick="saveBridgeProfile()" style="margin-top: 15px; width: 100%;">保存并更新所有个人信息</button>
        <p id="bridge-msg" style="color: green; font-size: 13px; margin: 10px 0; text-align:center;"></p>
    </div>
</div>

<script>
    // 初始化复用主项目的 Supabase 实例
    const db = window.sbApp || window.supabase.createClient('https://snlikjcmuwkyibogfupy.supabase.co', 'sb_publishable_8stbmdXfZMtBGjwaq16ajw_KBDzE9ZW');
    let currentUser = null;

    // 页面加载时检查登录并拉取数据
    async function initBridgePage() {
        const { data: { session } } = await db.auth.getSession();
        if (!session) {
            alert('请先登录论坛！');
            window.location.href = 'index.html';
            return;
        }
        currentUser = session.user;
        loadUserProfileData(currentUser.id);
    }

    // 从 profiles 表加载用户详细数据
    async function loadUserProfileData(userId) {
        const { data, error } = await db.from('profiles').select('*').eq('id', userId).single();
        if (error || !data) {
            console.error('获取档案失败', error);
            return;
        }

        // 基础与账号信息
        document.getElementById('p-email').value = currentUser.email;
        document.getElementById('p-role').value = data.is_admin ? '管理员' : '普通成员';
        document.getElementById('p-grade').value = data.grade || '高一';
        document.getElementById('p-nickname').value = data.nickname || '';

        // 等级与经验展示
        const exp = data.exp || 0;
        const level = data.level || 1;
        document.getElementById('user-level-tag').innerText = `Lv.${level} (当前经验: ${exp})`;

        // 头像显示：如果数据库存了头像URL，则显示，否则默认为 icon.png
        const avatarImg = document.getElementById('user-avatar');
        avatarImg.src = data.avatar_url || 'icon.png';

        // 扩展字段
        const fields = ['real_name', 'phone', 'gender', 'age', 'birthday', 'constellation', 'hometown'];
        fields.forEach(field => {
            document.getElementById(`p-${field.replace('_', '-')}`).value = data[field] || '';
            const pubCheckbox = document.getElementById(`pub-${field.replace('_', '-')}`);
            if (pubCheckbox) {
                pubCheckbox.checked = data[`pub_${field}`] !== false; // 默认勾选公开
            }
        });
    }

    // 处理头像本地压缩或直接转Base64存储在 Supabase profiles 的 avatar_url 中
    window.handleAvatarUpload = function(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Img = e.target.result;
                // 实时预览
                document.getElementById('user-avatar').src = base64Img;
                
                // 自动同步保存到 Supabase 数据库
                const { error } = await db.from('profiles').update({
                    avatar_url: base64Img
                }).eq('id', currentUser.id);

                const msgEl = document.getElementById('avatar-msg');
                if (error) {
                    msgEl.style.color = 'red';
                    msgEl.innerText = '头像更新到数据库失败: ' + error.message;
                } else {
                    msgEl.style.color = 'green';
                    msgEl.innerText = '头像已成功更新并保存！';
                }
            };
            reader.readAsDataURL(file);
        }
    }

    // 保存所有个人信息修改
    window.saveBridgeProfile = async function() {
        if (!currentUser) return;

        const updateData = {
            grade: document.getElementById('p-grade').value,
            nickname: document.getElementById('p-nickname').value.trim(),
            real_name: document.getElementById('p-real-name').value.trim(),
            pub_real_name: document.getElementById('pub-real-name').checked,
            phone: document.getElementById('p-phone').value.trim(),
            pub_phone: document.getElementById('pub-phone').checked,
            gender: document.getElementById('p-gender').value.trim(),
            pub_gender: document.getElementById('pub-gender').checked,
            age: document.getElementById('p-age').value ? parseInt(document.getElementById('p-age').value) : null,
            pub_age: document.getElementById('pub-age').checked,
            birthday: document.getElementById('p-birthday').value.trim(),
            pub_birthday: document.getElementById('pub-birthday').checked,
            constellation: document.getElementById('p-constellation').value.trim(),
            pub_constellation: document.getElementById('pub-constellation').checked,
            hometown: document.getElementById('p-hometown').value.trim(),
            pub_hometown: document.getElementById('pub-hometown').checked
        };

        const { error } = await db.from('profiles').update(updateData).eq('id', currentUser.id);
        const msgEl = document.getElementById('bridge-msg');
        
        if (error) {
            msgEl.style.color = 'red';
            msgEl.innerText = '保存失败: ' + error.message;
        } else {
            msgEl.style.color = 'green';
            msgEl.innerText = '✅ 个人信息与权限设置已成功同步保存！';
            setTimeout(() => { msgEl.innerText = ''; }, 3000);
        }
    }

    initBridgePage();
</script>

</body>
</html>
