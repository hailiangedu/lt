<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动空间</title>
    <link rel="icon" type="image/png" href="./image.png">
    <link rel="manifest" href="manifest.json">
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 全局配置与共享工具层 -->
    <script src="config.js"></script>
    <script src="common.js"></script>
    <!-- 引入独立的 PWA 引导脚本 -->
    <script src="main.js" defer></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --text-color: #2d3748;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(226, 232, 240, 0.6);
            --primary-color: #3182ce;
            --meta-color: #718096;
            --hover-bg: #ebf8ff;
        }
        [data-theme="dark"] {
            --bg-color: #1a202c;
            --text-color: #f7fafc;
            --card-bg: rgba(45, 55, 72, 0.85);
            --border-color: rgba(74, 85, 104, 0.6);
            --primary-color: #63b3ed;
            --meta-color: #a0aec0;
            --hover-bg: #2c5282;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: url('beijing.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }
        .container {
            max-width: 1050px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        .flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-value {
            color: var(--text-color);
            font-size: 14px;
            line-height: 1.5;
            flex-grow: 1;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            opacity: 0.9;
        }
        .profile-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }
        .profile-row label {
            width: 75px;
            font-size: 13px;
            color: var(--meta-color);
            flex-shrink: 0;
        }
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px 20px;
        }
        @media (max-width: 900px) {
            .profile-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
        /* 功能集成区网格按钮 */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        .feature-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            text-decoration: none;
        }
        .feature-btn:hover {
            background-color: var(--hover-bg);
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }
        .avatar-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background-color: #fff;
            cursor: pointer;
        }
        .level-badge {
            display: inline-block;
            background: #3182ce;
            color: white;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .privacy-tag {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #e2e8f0;
            color: #4a5568;
            flex-shrink: 0;
        }
        [data-theme="dark"] .privacy-tag {
            background: #4a5568;
            color: #cbd5e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card flex" style="padding: 15px 25px;">
            <h2 style="margin:0;">互动空间</h2>
            <button onclick="window.location.href='index.html'" style="background:#718096;">返回论坛</button>
        </div>

        <div class="card">
            <div class="avatar-container">
                <!-- 点击头像本身触发隐藏的文件选择器，实现自定义头像更换 -->
                <img id="user-avatar" src="icon.png" alt="用户头像" class="avatar-img" title="点击更换头像">
                <input type="file" id="avatar-file-input" accept="image/*" style="display: none;">
                <div id="user-nickname-title" style="font-weight: bold; font-size: 18px; margin-top: 10px;">加载中...</div>
                <div id="avatar-msg" style="font-size: 11px; color: var(--meta-color); margin-top: 5px;"></div>
            </div>
            
            <div style="text-align: center; margin-bottom: 15px;">
                <div id="user-level-tag" class="level-badge">Lv.1 (经验: 0)</div>
            </div>

            <h3>账号与基本资料</h3>
            <div class="profile-grid" style="margin-bottom: 15px;">
                <div class="profile-row">
                    <label>绑定邮箱：</label>
                    <div id="p-email" class="info-value">-</div>
                </div>
                <div class="profile-row">
                    <label>当前身份：</label>
                    <div id="p-role" class="info-value">-</div>
                </div>
                <div class="profile-row">
                    <label>年级：</label>
                    <div id="p-grade" class="info-value">-</div>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">

            <h3>详细个人档案与公开状态</h3>
            <div class="profile-grid">
                <div class="profile-row">
                    <label>真实姓名：</label>
                    <div id="p-real-name" class="info-value">-</div>
                    <span id="tag-real-name" class="privacy-tag">状态</span>
                </div>
                <div class="profile-row">
                    <label>手机号：</label>
                    <div id="p-phone" class="info-value">-</div>
                    <span id="tag-phone" class="privacy-tag">状态</span>
                </div>
                <div class="profile-row">
                    <label>性别：</label>
                    <div id="p-gender" class="info-value">-</div>
                    <span id="tag-gender" class="privacy-tag">状态</span>
                </div>
                <div class="profile-row">
                    <label>年龄：</label>
                    <div id="p-age" class="info-value">-</div>
                    <span id="tag-age" class="privacy-tag">状态</span>
                </div>
                <div class="profile-row">
                    <label>生日：</label>
                    <div id="p-birthday" class="info-value">-</div>
                    <span id="tag-birthday" class="privacy-tag">状态</span>
                </div>
                <div class="profile-row">
                    <label>星座：</label>
                    <div id="p-constellation" class="info-value">-</div>
                    <span id="tag-constellation" class="privacy-tag">状态</span>
                </div>
                <div class="profile-row">
                    <label>故乡：</label>
                    <div id="p-hometown" class="info-value">-</div>
                    <span id="tag-hometown" class="privacy-tag">状态</span>
                </div>
            </div>
        </div>

        <!-- 新增功能集成区 -->
        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 10px;">功能集成区</h3>
            <div class="feature-grid">
                <a href="space.html" class="feature-btn">
                    <span>成员列表</span>
                    <span>→</span>
                </a>
                <a href="checkin.html" class="feature-btn">
                    <span>每日签到</span>
                    <span>→</span>
                </a>
                <!--<a href="confirm.html" class="feature-btn">
                    <span>认证中心</span>
                    <span>→</span>
                </a>
                <a href="index.html" class="feature-btn">
                    <span>返回论坛首页</span>
                    <span>→</span>
                </a>-->
            </div>
        </div>
    </div>

    <script>
        // 初始化主题与自定义背景（共享实现，含系统暗色偏好回退），并监听跨页实时同步
        initThemeAndBackground();
        watchSettingsSync();

        // 全局唯一 Supabase 客户端（由 common.js 的 getSupabaseClient() 懒创建并挂载 window.sbApp）
        const db = getSupabaseClient();

        // 页面级当前登录用户引用（initBridgePage 登录门禁通过后赋值，供头像上传等页面私有逻辑使用）
        let bridgeCurrentUser = null;

        async function initBridgePage() {
            const session = await requireLogin(db, 'index.html', '请先登录论坛！');
            if (!session) return;
            const currentUser = session.user;
            // 保存页面级用户引用，供头像上传等页面私有逻辑使用
            bridgeCurrentUser = currentUser;
            loadUserProfileData(currentUser);
        }

        async function loadUserProfileData(user) {
            const { data, error } = await db.from('profiles').select('*').eq('id', user.id).single();
            if (error || !data) {
                console.error('获取个人信息失败', error);
                return;
            }

            document.getElementById('p-email').innerText = user.email || '未绑定';
            document.getElementById('p-role').innerText = data.is_admin ? '管理员' : '普通成员';
            document.getElementById('p-grade').innerText = data.grade || '未设置';
            
            const nickname = data.nickname || '无昵称';
            document.getElementById('user-nickname-title').innerText = nickname;

            const exp = data.exp || 0;
            const level = data.level || 1;
            document.getElementById('user-level-tag').innerText = `Lv.${level} (当前经验: ${exp})`;

            // 头像显示白名单：仅采用以 data:image/ 或 http 开头的取值（兼容新压缩数据/历史 Base64/外链），
            // 空值与脏数据一律回退默认图标 icon.png
            const avatarUrl = typeof data.avatar_url === 'string' ? data.avatar_url : '';
            document.getElementById('user-avatar').src =
                (avatarUrl.startsWith('data:image/') || avatarUrl.startsWith('http')) ? avatarUrl : 'icon.png';

            const fields = ['real_name', 'phone', 'gender', 'age', 'birthday', 'constellation', 'hometown'];
            fields.forEach(field => {
                const val = data[field];
                const isPublic = data[`pub_${field}`] !== false; 
                const valEl = document.getElementById(`p-${field.replace('_', '-')}`);
                const tagEl = document.getElementById(`tag-${field.replace('_', '-')}`);

                if (valEl) {
                    valEl.innerText = (val !== null && val !== undefined && val !== '') ? val : '未填写';
                }
                if (tagEl) {
                    tagEl.innerText = isPublic ? '公开' : '私密';
                    tagEl.style.background = isPublic ? '#c6f6d5' : '#fed7d7';
                    tagEl.style.color = isPublic ? '#22543d' : '#742a2a';
                }
            });
        }

        // ==================== 自定义头像（点击头像更换，恢复自历史版本并新增压缩） ====================

        // 头像提示自动消失定时器
        let avatarMsgTimer = null;

        // 设置头像操作提示文本与颜色；autoHide 为 true 时 5 秒后自动清空（成功与失败提示一致）
        function setAvatarMsg(text, color, autoHide) {
            const msgEl = document.getElementById('avatar-msg');
            if (avatarMsgTimer) {
                clearTimeout(avatarMsgTimer);
                avatarMsgTimer = null;
            }
            msgEl.innerText = text;
            msgEl.style.color = color;
            if (autoHide && text) {
                avatarMsgTimer = setTimeout(() => {
                    msgEl.innerText = '';
                    avatarMsgTimer = null;
                }, 5000);
            }
        }

        // 将选定图片压缩为头像数据 URL：中心方形裁剪缩放至 256×256，JPEG 输出，
        // 质量阶梯 0.85→0.7→0.5→0.3 逐级降质兜底，保证压缩结果不超过 150KB。
        // 非图片文件 / 源文件超 20MB / 解码失败时 reject（错误信息面向用户可读）。
        function compressImageToAvatar(file) {
            return new Promise((resolve, reject) => {
                // 防护 1：仅接受图片类型
                if (!file.type || !file.type.startsWith('image/')) {
                    reject(new Error('请选择图片文件'));
                    return;
                }
                // 防护 2：拒绝超大源文件，避免拖垮读取与解码内存
                if (file.size > 20 * 1024 * 1024) {
                    reject(new Error('图片文件过大（超过 20MB），请更换较小的图片'));
                    return;
                }

                const reader = new FileReader();
                reader.onerror = () => reject(new Error('读取图片文件失败，请重试'));
                reader.onload = (e) => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('图片解码失败，文件可能已损坏，请更换图片'));
                    img.onload = () => {
                        try {
                            // 中心方形裁剪：取图片中央正方形区域，保证任意比例照片在圆形头像框内构图正确
                            const side = Math.min(img.naturalWidth || 0, img.naturalHeight || 0);
                            if (!side) {
                                reject(new Error('图片解码失败，文件可能已损坏，请更换图片'));
                                return;
                            }
                            const sx = (img.naturalWidth - side) / 2;
                            const sy = (img.naturalHeight - side) / 2;

                            const canvas = document.createElement('canvas');
                            canvas.width = 256;
                            canvas.height = 256;
                            const ctx = canvas.getContext('2d');
                            // 先铺白底，防止透明 PNG 转 JPEG 后透明区域变黑
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(0, 0, 256, 256);
                            ctx.drawImage(img, sx, sy, side, side, 0, 0, 256, 256);

                            // 质量阶梯：0.85 → 0.7 → 0.5 → 0.3，逐级降质直至结果 ≤150KB
                            const MAX_AVATAR_BYTES = 150 * 1024;
                            const qualities = [0.85, 0.7, 0.5, 0.3];
                            let dataUrl = '';
                            for (let i = 0; i < qualities.length; i++) {
                                dataUrl = canvas.toDataURL('image/jpeg', qualities[i]);
                                if (dataUrl.length <= MAX_AVATAR_BYTES) break;
                            }
                            resolve(dataUrl);
                        } catch (err) {
                            reject(new Error('图片压缩处理失败，请更换图片重试'));
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 将头像数据 URL 持久化到当前登录用户的 profiles.avatar_url（RLS 保证仅本人可改）
        async function persistAvatar(dataUrl) {
            const { error } = await db.from('profiles').update({ avatar_url: dataUrl }).eq('id', bridgeCurrentUser.id);
            if (error) {
                throw new Error('头像更新到数据库失败: ' + error.message);
            }
        }

        // 头像上传防重入标志（处理进行中忽略再次触发）
        let avatarUploading = false;

        // 头像上传主流程：压缩 → 保存成功后再更新显示。
        // 关键顺序约束：先压缩保存成功、再更新头像显示，避免历史"保存失败但头像已变"的不一致问题。
        async function handleAvatarFileSelected(input) {
            // 双重保险：登录门禁未通过（bridgeCurrentUser 为空）时不处理，跳转交由 requireLogin 负责
            if (!bridgeCurrentUser) {
                input.value = '';
                return;
            }
            const file = input.files && input.files[0];
            // 用户在文件选择器中取消选择：无任何变化与提示
            if (!file) {
                input.value = '';
                return;
            }
            if (avatarUploading) {
                input.value = '';
                return;
            }

            avatarUploading = true;
            setAvatarMsg('保存中...', 'var(--meta-color)');
            try {
                const dataUrl = await compressImageToAvatar(file);
                await persistAvatar(dataUrl);
                // 压缩与保存均已成功，此时才更新头像显示
                document.getElementById('user-avatar').src = dataUrl;
                setAvatarMsg('头像已成功更新并保存！', 'green', true);
            } catch (err) {
                setAvatarMsg(err.message || '头像更新失败，请重试', 'red', true);
            } finally {
                avatarUploading = false;
                // 重置 input，确保同一文件可以被重复选择
                input.value = '';
            }
        }

        // 点击头像本身触发隐藏的文件选择器（登录门禁未通过时不提供更换入口）
        document.getElementById('user-avatar').addEventListener('click', () => {
            if (!bridgeCurrentUser) return;
            document.getElementById('avatar-file-input').click();
        });

        // 文件选定后进入上传主流程
        document.getElementById('avatar-file-input').addEventListener('change', function () {
            handleAvatarFileSelected(this);
        });

        initBridgePage();
    </script>
</body>
</html>
