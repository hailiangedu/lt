<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站内私信</title>
    <link rel="icon" type="image/png" href="./image.png">
    <!-- PWA 应用清单 -->
    <link rel="manifest" href="manifest.json">
    <!-- iOS 添加到主屏高清图标 -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <!-- NexConn Web Chat SDK import map：必须位于任何 module 脚本之前（FR-007：仅聊天页加载 SDK，
         版本锁定 26.2.1 的 index.esm.js 产物以命中 sw.js jsdelivr SWR 白名单 /\.js$/，plan D1/D6） -->
    <script type="importmap">
    {
        "imports": {
            "@nexconn/engine": "https://cdn.jsdelivr.net/npm/@nexconn/engine@26.2.1/index.esm.js",
            "@nexconn/chat": "https://cdn.jsdelivr.net/npm/@nexconn/chat@26.2.1/index.esm.js"
        }
    }
    </script>
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 全局配置与共享工具层 -->
    <script src="config.js?v=1"></script>
    <script src="common.js?v=1"></script>
    <!-- 引入独立的 PWA 引导脚本 -->
    <script src="main.js?v=1" defer></script>
    <!-- 聊天页主逻辑（ESM module：经 import map 解析 @nexconn/chat 裸导入） -->
    <script type="module" src="chat.js?v=1"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --text-color: #2d3748;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(226, 232, 240, 0.6);
            --primary-color: #3182ce;
            --meta-color: #718096;
            --hover-bg: #ebf8ff;
            --admin-badge: #e53e3e;
            --online-color: #48bb78;
        }
        [data-theme="dark"] {
            --bg-color: #1a202c;
            --text-color: #f7fafc;
            --card-bg: rgba(45, 55, 72, 0.85);
            --border-color: rgba(74, 85, 104, 0.6);
            --primary-color: #63b3ed;
            --meta-color: #a0aec0;
            --hover-bg: #2c5282;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: url('beijing.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }
        .container { max-width: 950px; margin: 0 auto; }
        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none !important; }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.6; cursor: default; }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
        }
        /* ===== 双栏布局：桌面（>768px）会话列表 + 消息并列 ===== */
        .chat-layout { display: flex; gap: 15px; align-items: flex-start; }
        #chat-list-pane { width: 320px; flex-shrink: 0; }
        #chat-msg-pane { flex: 1; min-width: 0; }
        .msg-card { padding: 14px; display: flex; flex-direction: column; }
        /* 会话列表项 */
        .conv-item {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 6px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }
        .conv-item:last-child { border-bottom: none; }
        .conv-item:hover { background: var(--hover-bg); }
        .conv-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .conv-main { flex: 1; min-width: 0; }
        .conv-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .conv-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-time { font-size: 11px; color: var(--meta-color); flex-shrink: 0; }
        .conv-preview { font-size: 12px; color: var(--meta-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .conv-unread {
            background: #e53e3e;
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            text-align: center;
            line-height: 16px;
            padding: 0 4px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        /* 消息区 */
        #msg-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }
        #msg-back-btn { display: none; }
        #msg-scroll {
            height: 55vh;
            overflow-y: auto;
            padding: 4px 6px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.35);
        }
        [data-theme="dark"] #msg-scroll { background: rgba(26, 32, 44, 0.35); }
        #msg-input-bar { display: flex; gap: 8px; margin-top: 8px; }
        #msg-input-bar input { flex: 1; margin-bottom: 0; }
        #msg-input-bar button { flex-shrink: 0; }
        /* 气泡流 */
        .msg-row { display: flex; gap: 8px; margin: 6px 0; align-items: flex-start; }
        .msg-row.mine { flex-direction: row-reverse; }
        .msg-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-top: 2px; }
        .msg-body { max-width: 72%; display: flex; flex-direction: column; }
        .msg-row.mine .msg-body { align-items: flex-end; }
        .msg-bubble {
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg-row.theirs .msg-bubble {
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-top-left-radius: 2px;
        }
        .msg-row.mine .msg-bubble {
            background: var(--primary-color);
            color: #fff;
            border-top-right-radius: 2px;
        }
        .msg-meta { font-size: 10px; color: var(--meta-color); margin-top: 2px; }
        .msg-status-failed { color: #e53e3e; cursor: pointer; font-weight: 600; }
        .load-earlier-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--meta-color);
            font-size: 11px;
            font-weight: 400;
            padding: 2px 10px;
            border-radius: 10px;
            cursor: pointer;
        }
        /* 骨架屏 */
        .skeleton-bar {
            height: 14px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--hover-bg) 25%, var(--border-color) 50%, var(--hover-bg) 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.4s infinite;
            margin: 12px 0;
        }
        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        /* ===== 移动端（<=768px）：单栏，会话列表 ⇄ 消息视图切换 ===== */
        @media (max-width: 768px) {
            body { font-size: 12px; padding: 6px; }
            .card { padding: 12px; margin-bottom: 8px; border-radius: 8px; }
            h2 { font-size: 1.1rem; }
            h3 { font-size: 0.95rem; }
            button { font-size: 12px; padding: 6px 10px; }
            .chat-layout { flex-direction: column; }
            #chat-list-pane { width: 100%; }
            /* 单栏切换：默认显示会话列表；打开会话后由 chat.js 加 .show-msg 只显示消息栏 */
            #chat-main:not(.show-msg) #chat-msg-pane { display: none; }
            #chat-main.show-msg #chat-list-pane { display: none; }
            #msg-back-btn {
                display: inline-block;
                background: none;
                border: 1px solid var(--border-color);
                color: var(--text-color);
                font-size: 12px;
                font-weight: 400;
                padding: 2px 10px;
            }
            #msg-scroll { height: 50vh; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部导航卡：返回论坛 + 标题 + 连接状态指示 -->
        <div class="card flex">
            <div>
                <h2 style="margin:0;">站内私信</h2>
                <span id="conn-status" style="font-size: 12px; color: var(--meta-color);">正在检查登录状态...</span>
            </div>
            <button onclick="window.location.href='index.html'" style="background:#4a5568;">返回论坛</button>
        </div>

        <!-- 登录门（FR-012）：未登录时由 requireLogin 引导回论坛登录，此处为引导占位 -->
        <div id="chat-login-gate" class="card" style="text-align: center; padding: 40px 20px;">
            <p style="font-size: 15px; color: var(--meta-color); margin: 0 0 16px 0;">请先登录后使用站内私信</p>
            <button onclick="window.location.href='index.html'">去登录</button>
        </div>

        <!-- 可重试错误态（FR-009）：凭证未配置 / EF 未部署 / 网络异常 / 连接失败，绝不白屏 -->
        <div id="chat-error" class="card hidden" style="text-align: center; padding: 40px 20px;">
            <p id="chat-error-msg" style="font-size: 14px; color: var(--meta-color); margin: 0 0 16px 0;">聊天服务暂不可用</p>
            <button id="chat-retry-btn">重试</button>
        </div>

        <!-- 骨架屏：获取 token / 建立 IM 连接中 -->
        <div id="chat-skeleton" class="card hidden">
            <div class="skeleton-bar" style="width: 55%;"></div>
            <div class="skeleton-bar" style="width: 85%;"></div>
            <div class="skeleton-bar" style="width: 70%;"></div>
            <div class="skeleton-bar" style="width: 90%;"></div>
            <div class="skeleton-bar" style="width: 45%;"></div>
        </div>

        <!-- 聊天主界面：桌面双栏 / 移动单栏（.show-msg 切换） -->
        <div id="chat-main" class="hidden">
            <div class="chat-layout">
                <!-- 左栏：会话列表 -->
                <div id="chat-list-pane">
                    <div class="card">
                        <h3 style="margin: 0 0 8px 0;">会话列表</h3>
                        <div id="conv-loading" style="font-size: 12px; color: var(--meta-color); text-align: center; padding: 12px 0;">加载会话中...</div>
                        <div id="conversation-list"></div>
                        <!-- 空状态引导：从未有过会话的新账号 -->
                        <div id="conv-empty" class="hidden" style="text-align: center; padding: 24px 8px;">
                            <p style="font-size: 13px; color: var(--meta-color); margin: 0 0 8px 0;">暂无私信会话</p>
                            <p style="font-size: 12px; color: var(--meta-color); margin: 0;">可从他人的个人主页、成员列表或帖子作者处点击"发消息"发起私聊</p>
                        </div>
                    </div>
                </div>
                <!-- 右栏：消息视图 -->
                <div id="chat-msg-pane">
                    <div class="card msg-card">
                        <!-- 消息视图头部：返回列表（移动端显示）+ 对端昵称 -->
                        <div id="msg-header" class="hidden">
                            <button id="msg-back-btn" type="button">← 会话</button>
                            <b id="msg-peer-name" style="font-size: 14px;"></b>
                        </div>
                        <!-- 桌面端未选会话时的占位提示 -->
                        <div id="msg-placeholder" style="text-align: center; padding: 60px 0;">
                            <p style="font-size: 13px; color: var(--meta-color); margin: 0;">选择一个会话开始聊天</p>
                        </div>
                        <!-- 消息内容区 -->
                        <div id="msg-content" class="hidden">
                            <div id="msg-scroll">
                                <div style="text-align: center; padding: 4px 0;">
                                    <button id="load-earlier-btn" type="button" class="load-earlier-btn hidden">加载更早的消息</button>
                                    <span id="history-loading-hint" class="hidden" style="font-size: 11px; color: var(--meta-color);">加载中...</span>
                                </div>
                                <div id="msg-list"></div>
                            </div>
                            <div id="msg-input-bar">
                                <input type="text" id="msg-input" placeholder="输入消息..." autocomplete="off" maxlength="2000">
                                <button id="msg-send-btn" type="button">发送</button>
                            </div>
                            <p id="msg-notice" class="hidden" style="font-size: 11px; color: #e53e3e; margin: 6px 0 0 0;"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
