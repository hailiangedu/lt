<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>意见反馈</title>
    <link rel="icon" type="image/x-icon" href="https://school.hailiangedu.com/favicon.ico">
    <!-- PWA 应用清单 -->
    <link rel="manifest" href="manifest.json">
    <!-- iOS 添加到主屏高清图标 -->
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 全局配置与共享工具层 -->
    <script src="config.js?v=1"></script>
    <script src="common.js?v=1"></script>
    <!-- 引入独立的 PWA 引导脚本 -->
    <script src="main.js?v=1" defer></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: rgba(255, 255, 255, 0.45); /* 半透明卡片背景，使背景隐隐约约可见 */
            --text-color: #2d3748;
            --meta-color: #718096;
            --border-color: rgba(226, 232, 240, 0.6);
            --primary-color: #3182ce;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --card-bg: rgba(45, 55, 72, 0.45); /* 暗黑模式下的半透明卡片 */
            --text-color: #f7fafc;
            --meta-color: #a0aec0;
            --border-color: rgba(74, 85, 104, 0.6);
            --primary-color: #63b3ed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            /* 默认背景图片，若无自定义背景则展示 */
            background-image: url('beijing.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card-bg);
            /* 添加磨砂玻璃毛玻璃特效，让背景完美隐现 */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            /* 文本框同样半透明化 */
            background-color: rgba(255, 255, 255, 0.3);
            color: var(--text-color);
            resize: vertical;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 16px;
        }

        [data-theme="dark"] textarea {
            background-color: rgba(26, 32, 44, 0.3);
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.9;
        }

        .back-link {
            font-size: 13px;
            color: var(--meta-color);
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>意见反馈</h2>
        <p style="font-size: 13px; color: var(--meta-color); margin-bottom: 12px;">
            如果您在使用论坛时遇到任何问题或有好的建议，请随时提交。您的反馈将发送给所有管理员。
        </p>
        <textarea id="feedback-content" placeholder="请详细描述您遇到的问题或建议..."></textarea>
        <div class="btn-group">
            <a href="index.html" class="back-link">← 返回论坛首页</a>
            <button onclick="submitFeedback()">提交反馈</button>
        </div>
    </div>

    <script>
        // 初始化主题与自定义背景（共享实现，含系统暗色偏好回退），并监听跨页实时同步
        initThemeAndBackground();
        watchSettingsSync();

        // 全局唯一 Supabase 客户端（由 common.js 的 getSupabaseClient() 懒创建并挂载 window.sbApp）
        const db = getSupabaseClient();

        async function submitFeedback() {
            const contentInput = document.getElementById('feedback-content');
            const content = contentInput.value.trim();

            if (!content) {
                alert('反馈内容不能为空！');
                return;
            }

            // 检查当前用户是否登录
            const session = await requireLogin(db, 'index.html', '请先登录后再提交反馈！');
            if (!session) return;

            if (typeof window.initGlobalPresence === 'function') {
                window.initGlobalPresence(session.user);
            }

            const userId = session.user.id;

            // 获取当前用户的昵称
            const { data: profile } = await db
                .from('profiles')
                .select('nickname')
                .eq('id', userId)
                .single();

            const userName = profile ? profile.nickname : session.user.email.split('@')[0];

            // 1. 查询所有管理员用户的 ID
            const { data: admins, error: adminErr } = await db
                .from('profiles')
                .select('id')
                .eq('is_admin', true);

            if (adminErr || !admins || admins.length === 0) {
                alert('当前暂无管理员接收反馈，提交失败。');
                return;
            }

            // 2. 组装发给所有管理员的通知数据
            const notificationsData = admins.map(admin => ({
                user_id: admin.id,
                title: `收到新的意见反馈 (来自: ${userName})`,
                content: content,
                is_read: false
            }));

            // 3. 批量写入 notifications 表
            const { error: insertErr } = await db
                .from('notifications')
                .insert(notificationsData);

            if (insertErr) {
                alert('反馈提交失败: ' + insertErr.message);
            } else {
                alert('反馈提交成功！感谢您的宝贵意见，管理员已收到通知。');
                contentInput.value = '';
            }
        }
    </script>
</body>
</html>
