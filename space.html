<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动空间</title>
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --text-color: #2d3748;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(226, 232, 240, 0.6);
            --primary-color: #3182ce;
            --meta-color: #718096;
            --hover-bg: #ebf8ff;
            --admin-badge: #e53e3e;
            --online-color: #48bb78;
            --offline-color: #a0aec0;
        }
        [data-theme="dark"] {
            --bg-color: #1a202c;
            --text-color: #f7fafc;
            --card-bg: rgba(45, 55, 72, 0.85);
            --border-color: rgba(74, 85, 104, 0.6);
            --primary-color: #63b3ed;
            --meta-color: #a0aec0;
            --hover-bg: #2c5282;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: url('beijing.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }
        .container { max-width: 950px; margin: 0 auto; }
        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { opacity: 0.9; }
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        /* 优化后的卡片：紧凑横向排版，大幅节省垂直空间 */
        .user-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .user-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
        }
        .user-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--meta-color);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .status-dot.online { background-color: var(--online-color); box-shadow: 0 0 4px var(--online-color); }
        .status-dot.offline { background-color: var(--offline-color); }
        .badge-admin {
            background-color: var(--admin-badge);
            color: white;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 顶部导航栏 -->
    <div class="card flex">
        <div>
            <h2 style="margin:0;">互动空间</h2>
            <span style="font-size: 12px; color: var(--meta-color);">实时查看所有注册用户及其在线状态</span>
        </div>
        <button onclick="window.location.href='index.html'" style="background:#4a5568;">返回论坛主页</button>
    </div>

    <!-- 用户列表展示区 -->
    <div class="card">
        <h3>论坛成员大厅</h3>
        <div id="users-container" class="user-grid">加载中...</div>
    </div>
</div>

<script>
    // 1. 初始化主题与自定义背景
    function initThemeAndBg() {
        const savedTheme = localStorage.getItem('forum_theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else if (savedTheme === 'light') {
            document.documentElement.removeAttribute('data-theme');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        const customBg = localStorage.getItem('forum_custom_bg') || localStorage.getItem('custom_bg') || localStorage.getItem('customBg') || localStorage.getItem('bg_image');
        if (customBg) {
            document.body.style.backgroundImage = `url("${customBg}")`;
        } else {
            document.body.style.backgroundImage = "url('beijing.png')";
        }
    }
    initThemeAndBg();

    window.addEventListener('storage', (event) => {
        if (event.key === 'forum_theme') {
            if (event.newValue === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        } else if (['forum_custom_bg', 'custom_bg', 'customBg', 'bg_image'].includes(event.key)) {
            if (event.newValue) {
                document.body.style.backgroundImage = `url("${event.newValue}")`;
            } else {
                document.body.style.backgroundImage = "url('beijing.png')";
            }
        }
    });

    // 2. Supabase 配置与实时在线逻辑
    const SUPABASE_URL = 'https://snlikjcmuwkyibogfupy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_8stbmdXfZMtBGjwaq16ajw_KBDzE9ZW';
    const sbApp = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function initSpace() {
        const { data: { session }, error: sessionError } = await sbApp.auth.getSession();
        if (sessionError || !session) {
            alert('请先登录论坛！');
            window.location.href = 'index.html';
            return;
        }
        const currentUser = session.user;
        const container = document.getElementById('users-container');

        // 先获取所有 profiles 数据
        const { data: profiles, error } = await sbApp.from('profiles').select('*');
        if (error) {
            container.innerHTML = `<p style="color:red;">加载用户失败: ${error.message}</p>`;
            return;
        }

        // 创建频道
        const room = sbApp.channel('online-users');

        // 渲染函数
        const renderUsers = () => {
            const presenceState = room.presenceState();
            const onlineUserIds = new Set();
            Object.values(presenceState).forEach(presences => {
                presences.forEach(p => onlineUserIds.add(p.user_id));
            });

            container.innerHTML = '';
            if (!profiles || profiles.length === 0) {
                container.innerHTML = `<p style="color:var(--meta-color);">暂无用户档案记录</p>`;
                return;
            }

            profiles.forEach(user => {
                const isOnline = onlineUserIds.has(user.id) || (user.id === currentUser?.id);
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                    <div class="user-info">
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <b style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${user.nickname || '未命名用户'}</b>
                            ${user.is_admin ? '<span class="badge-admin">管理员</span>' : ''}
                        </div>
                        <div class="user-meta">
                            <span>年级：${user.grade || '未填'}</span>
                        </div>
                    </div>
                    <div style="font-size: 12px; display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
                        <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
                        <span style="color: ${isOnline ? 'var(--online-color)' : 'var(--meta-color)'}; font-weight: 500;">
                            ${isOnline ? '在线' : '离线'}
                        </span>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        // 必须在 subscribe() 之前绑定 on 事件
        room.on('presence', { event: 'sync' }, renderUsers);
        room.on('presence', { event: 'join' }, renderUsers);
        room.on('presence', { event: 'leave' }, renderUsers);

        // 最后再 subscribe 并 track 自身状态
        room.subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
                await room.track({
                    user_id: currentUser.id,
                    online_at: new Date().toISOString(),
                });
                renderUsers();
            }
        });
    }

    initSpace();
</script>

</body>
</html>
