<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日签到</title>
    <link rel="icon" type="image/x-icon" href="https://school.hailiangedu.com/favicon.ico">
    <!-- PWA 应用清单 -->
    <link rel="manifest" href="manifest.json">
    <!-- 引入独立的 PWA 引导脚本 -->
    <script src="main.js" defer></script>
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: rgba(255, 255, 255, 0.45);
            --text-color: #2d3748;
            --meta-color: #718096;
            --border-color: rgba(226, 232, 240, 0.6);
            --primary-color: #3182ce;
            --gold-color: #d69e2e;
            --silver-color: #718096;
            --bronze-color: #dd6b20;
        }
        [data-theme="dark"] {
            --bg-color: #1a202c;
            --card-bg: rgba(45, 55, 72, 0.45);
            --text-color: #f7fafc;
            --meta-color: #a0aec0;
            --border-color: rgba(74, 85, 104, 0.6);
            --primary-color: #63b3ed;
            --gold-color: #ecc94b;
            --silver-color: #cbd5e0;
            --bronze-color: #ed8936;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: url('beijing.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            margin-bottom: 12px;
        }
        .desc {
            font-size: 13px;
            color: var(--meta-color);
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            background-color: var(--meta-color);
            cursor: not-allowed;
            opacity: 0.6;
        }
        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .back-link {
            font-size: 13px;
            color: var(--meta-color);
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        /* 排行榜样式 */
        .rank-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        .rank-item:last-child {
            border-bottom: none;
        }
        .rank-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .rank-num {
            font-weight: bold;
            width: 20px;
            text-align: center;
        }
        .rank-item:nth-child(1) .rank-num { color: var(--gold-color); }
        .rank-item:nth-child(2) .rank-num { color: var(--silver-color); }
        .rank-item:nth-child(3) .rank-num { color: var(--bronze-color); }
        .rank-time {
            font-size: 12px;
            color: var(--meta-color);
        }
        .rank-reward {
            font-size: 12px;
            background: rgba(49, 130, 206, 0.15);
            color: var(--primary-color);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 签到操作卡片 -->
        <div class="card">
            <h2>每日签到打卡</h2>
            <p class="desc">
                每日 0 点（UTC+8）刷新签到状态。<br>
                <strong>奖励规则：</strong> 第 1 名签到经验 +5，第 2 名 +4，第 3 名 +3，其余按时签到者均可参与打卡记录。
            </p>
            <div class="btn-container">
                <button id="checkin-btn" onclick="handleCheckIn()">点击签到</button>
            </div>
            <div class="footer-nav">
                <a href="index.html" class="back-link">← 返回论坛首页</a>
            </div>
        </div>

        <!-- 今日签到排行榜卡片 -->
        <div class="card">
            <h2>今日签到排行榜</h2>
            <ul id="rank-list" class="rank-list">
                <li class="rank-item" style="color: var(--meta-color); justify-content: center;">加载中...</li>
            </ul>
        </div>
    </div>

    <script>
        // 1. 初始化主题与自定义背景（与 feedback.html 保持一致）
        function initThemeAndBg() {
            const savedTheme = localStorage.getItem('forum_theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (savedTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }

            const customBg = localStorage.getItem('forum_custom_bg') || localStorage.getItem('custom_bg') || localStorage.getItem('customBg') || localStorage.getItem('bg_image');
            if (customBg) {
                document.body.style.backgroundImage = `url("${customBg}")`;
            } else {
                document.body.style.backgroundImage = "url('beijing.png')";
            }
        }
        initThemeAndBg();

        window.addEventListener('storage', (event) => {
            if (event.key === 'forum_theme') {
                if (event.newValue === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
            } else if (['forum_custom_bg', 'custom_bg', 'customBg', 'bg_image'].includes(event.key)) {
                if (event.newValue) {
                    document.body.style.backgroundImage = `url("${event.newValue}")`;
                } else {
                    document.body.style.backgroundImage = "url('beijing.png')";
                }
            }
        });

        // 2. Supabase 签到及排行榜逻辑
        const sbApp = window.sbApp;

        // 获取当前 UTC+8 的日期字符串 (YYYY-MM-DD)
        function getTodayString() {
            const now = new Date();
            // 转换为 UTC+8
            const utc8Date = new Date(now.getTime() + (8 * 60 - now.getTimezoneOffset()) * 60000);
            return utc8Date.toISOString().split('T')[0];
        }

        async function initCheckInPage() {
            if (!window.db) {
                setTimeout(initCheckInPage, 100);
                return;
            }
            await checkUserStatus();
            await loadRankings();
        }

        // 检查当前用户今天是否已经签到
        async function checkUserStatus() {
            const { data: { session } } = await window.db.auth.getSession();
            if (!session) return;

            const userId = session.user.id;
            const todayStr = getTodayString();

            const { data, error } = await window.db
                .from('checkins')
                .select('*')
                .eq('user_id', userId)
                .eq('checkin_date', todayStr)
                .single();

            if (data) {
                const btn = document.getElementById('checkin-btn');
                btn.innerText = '今日已签到';
                btn.disabled = true;
            }
        }

        // 执行签到
        async function handleCheckIn() {
            const { data: { session } } = await window.db.auth.getSession();
            if (!session) {
                alert('请先登录后再进行签到！');
                window.location.href = 'index.html';
                return;
            }

            const userId = session.user.id;
            const todayStr = getTodayString();
            const btn = document.getElementById('checkin-btn');
            btn.disabled = true;

            // 1. 检查今天已签到人数，决定当前名次以计算额外经验
            // （按照签到时间升序排列获取当前已签到总数）
            const { count, error: countErr } = await window.db
                .from('checkins')
                .select('*', { count: 'exact', head: true })
                .eq('checkin_date', todayStr);

            if (countErr) {
                alert('签到失败，请稍后重试');
                btn.disabled = false;
                return;
            }

            const currentRank = (count || 0) + 1;
            let bonusExp = 0;
            if (currentRank === 1) bonusExp = 5;
            else if (currentRank === 2) bonusExp = 4;
            else if (currentRank === 3) bonusExp = 3;

            // 2. 写入数据库 checkins 表
            const { error: insertErr } = await window.db
                .from('checkins')
                .insert([{
                    user_id: userId,
                    checkin_date: todayStr,
                    rank: currentRank,
                    bonus_exp: bonusExp
                }]);

            if (insertErr) {
                if (insertErr.code === '23505') { // 唯一约束冲突（防止重复点击并发）
                    alert('您今天已经签到过了！');
                } else {
                    alert('签到失败: ' + insertErr.message);
                    btn.disabled = false;
                }
                return;
            }

            // 3. 更新用户 profiles 表的经验值
            if (bonusExp > 0) {
                // 获取当前经验并加上奖励
                const { data: profile } = await window.db
                    .from('profiles')
                    .select('exp')
                    .eq('id', userId)
                    .single();
                
                const currentExp = profile && profile.exp ? profile.exp : 0;
                await window.db
                    .from('profiles')
                    .update({ exp: currentExp + bonusExp })
                    .eq('id', userId);
            }

            alert(`签到成功！你是今天的第 ${currentRank} 位签到者，获得奖励经验 +${bonusExp}`);
            btn.innerText = '今日已签到';
            loadRankings();
        }

        // 加载今日排行榜
        async function loadRankings() {
            const todayStr = getTodayString();
            const rankListEl = document.getElementById('rank-list');

            // 联合查询 checkins 与 profiles 获取昵称
            const { data, error } = await window.db
                .from('checkins')
                .select(`
                    rank,
                    created_at,
                    bonus_exp,
                    profiles (
                        nickname
                    )
                `)
                .eq('checkin_date', todayStr)
                .order('rank', { ascending: true })
                .limit(20);

            if (error || !data || data.length === 0) {
                rankListEl.innerHTML = `<li class="rank-item" style="color: var(--meta-color); justify-content: center;">今日暂无签到记录，快来抢沙发吧！</li>`;
                return;
            }

            rankListEl.innerHTML = data.map((item, index) => {
                const nickname = item.profiles ? item.profiles.nickname : '未知用户';
                const timeStr = new Date(item.created_at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                return `
                    <li class="rank-item">
                        <div class="rank-left">
                            <span class="rank-num">${index + 1}</span>
                            <div>
                                <div>${escapeHtml(nickname)}</div>
                                <div class="rank-time">${timeStr}</div>
                            </div>
                        </div>
                        ${item.bonus_exp > 0 ? `<span class="rank-reward">经验 +${item.bonus_exp}</span>` : ''}
                    </li>
                `;
            }).join('');
        }

        // 简单的 HTML 转义防注入
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 页面加载完成后初始化
        initCheckInPage();
    </script>
</body>
</html>
